name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration
        uses: actions/checkout@v7
        with:
          path: integration

      # Home Assistant core version the tests run against: the latest stable
      # release (what users actually run; betas are skipped), resolved at run
      # time so there is nothing to bump. core@dev is deliberately not used -- its
      # test-harness refactors broke this pipeline without any change here. The
      # suite uses the core test harness (enable_custom_integrations, ...), so it
      # needs a core checkout rather than pytest-homeassistant-custom-component.
      - name: Resolve latest Home Assistant core release
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ref=$(gh api repos/home-assistant/core/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

      - name: Checkout Home Assistant core (${{ steps.core.outputs.ref }})
        uses: actions/checkout@v7
        with:
          repository: home-assistant/core
          ref: ${{ steps.core.outputs.ref }}
          path: core

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: core/.python-version

      - name: Install Home Assistant core + test deps
        working-directory: core
        run: |
          pip install --upgrade pip
          # paho-mqtt: core's tests/common.py imports paho.mqtt at module level,
          # but it ships via the mqtt integration, not requirements_test.txt.
          # pytest-homeassistant: since core#187095 it is no longer on pytest's
          # `pythonpath` -- core's tests/__init__.py imports it, so it must be
          # installed (same as core's own script/bootstrap does). Releases from
          # before that change don't ship it (helpers still in tests/common.py).
          extra=()
          for d in packages/pytest-home*assistant; do
            if [ -d "$d" ]; then extra+=(-e "$d"); fi
          done
          pip install -e . "${extra[@]}" -r requirements_test.txt paho-mqtt

      - name: Link Necromancer into the core test tree
        run: |
          mkdir -p core/tests/testing_config/custom_components
          ln -s "$GITHUB_WORKSPACE/integration/custom_components/necromancer" \
                core/tests/testing_config/custom_components/necromancer
          # Place the suite under tests/ but NOT tests/components/, so pytest only
          # loads tests/conftest.py (needs paho, installed) and not the shared
          # tests/components/conftest.py (which imports many integration deps).
          ln -s "$GITHUB_WORKSPACE/integration/tests/suite" \
                core/tests/necromancer

      - name: pytest suite
        working-directory: core
        run: python -m pytest tests/necromancer/ -q

      - name: In-process unit scripts
        working-directory: integration
        run: |
          # Some core snapshots (2026-10-17..19) put pytest_homeassistant on
          # sys.path only via pytest's `pythonpath` ini option, which plain
          # `python` doesn't honour, so it is spelled out here. Releases either
          # don't need it or install the package (see above); a missing dir is
          # harmless on PYTHONPATH.
          for f in test_units test_poe test_engine test_integration; do
            echo "::group::$f"
            PYTHONPATH="$GITHUB_WORKSPACE/core:$GITHUB_WORKSPACE/core/packages/pytest-home-assistant:$GITHUB_WORKSPACE/integration" \
              python "tests/$f.py"
            echo "::endgroup::"
          done
