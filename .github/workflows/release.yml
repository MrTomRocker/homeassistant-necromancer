name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-zip:
    name: Attach integration zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Zip the integration
        run: |
          cd custom_components/necromancer
          zip necromancer.zip -r ./
      - name: Zip the agent skill
        run: |
          cd skills
          zip necromancer-skill.zip -r necromancer
      - name: Upload zips to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            custom_components/necromancer/necromancer.zip
            skills/necromancer-skill.zip
